name: Build TRIZO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TRIZO_Android_Studio_Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract TRIZO project
        run: |
          unzip -o TRIZO_Android_Studio_Project.zip -d .
          test -f TRIZO_Android_Project/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p TRIZO_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRIZO-debug-APK
          path: TRIZO_Android_Project/app/build/outputs/apk/debug/app-debug.apk
